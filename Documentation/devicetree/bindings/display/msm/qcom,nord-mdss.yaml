%YAML 1.2
---
$id: http://devicetree.org/schemas/display/msm/qcom,nord-mdss.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm Nord Display MDSS

maintainers:
  - Krishna Manikandan <quic_mkrishn@quicinc.com>
  - Dmitry Baryshkov <dmitry.baryshkov@linaro.org>
  - Rob Clark <robdclark@gmail.com>

description:
  Nord MSM Mobile Display Subsystem(MDSS), which encapsulates sub-blocks like
  DPU display controller and DP interfaces etc. Nord is a dual independent
  MDSS SoC (MDSS_0 @ 0x0ae00000, MDSS_1 @ 0x08c00000); only MDSS_0 is enabled
  by board files for this bring-up, and MDSS_0 uses 2-cell (64-bit) addressing
  for its own reg/ranges, unlike most other Qualcomm MDSS wrapper nodes.
  There is no DSI on this chip -- DSI silicon is physically present but
  unused/unwired.

properties:
  $nodename:
    pattern: "^display-subsystem@[0-9a-f]+$"

  compatible:
    const: qcom,nord-mdss

  reg:
    maxItems: 1

  reg-names:
    const: mdss

  power-domains:
    maxItems: 1

  clocks:
    items:
      - description: Display AHB
      - description: Display hf AXI
      - description: Display core

  resets:
    items:
      - description: MDSS_CORE reset

  interrupts:
    maxItems: 1

  interrupt-controller: true

  "#address-cells": true

  "#size-cells": true

  "#interrupt-cells":
    const: 1

  iommus:
    maxItems: 1

  interconnects:
    items:
      - description: Interconnect path from mdp0 port to the data bus
      - description: Interconnect path from CPU to the reg bus

  interconnect-names:
    items:
      - const: mdp0-mem
      - const: cpu-cfg

  ranges: true

patternProperties:
  "^display-controller@[0-9a-f]+$":
    type: object
    additionalProperties: true
    properties:
      compatible:
        const: qcom,nord-dpu

  "^displayport-controller@[0-9a-f]+$":
    type: object
    additionalProperties: true
    properties:
      compatible:
        const: qcom,nord-dp

  "^phy@[0-9a-f]+$":
    type: object
    additionalProperties: true
    properties:
      compatible:
        const: qcom,nord-dp-phy

required:
  - compatible
  - reg
  - reg-names
  - power-domains
  - clocks
  - resets
  - interrupts
  - interrupt-controller
  - iommus
  - interconnects
  - interconnect-names
  - ranges

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/interconnect/qcom,icc.h>

    display-subsystem@ae00000 {
        compatible = "qcom,nord-mdss";
        reg = <0x0 0x0ae00000 0x0 0x1000>;
        reg-names = "mdss";

        power-domains = <&dispcc0 0>;
        clocks = <&dispcc0 1>,
                 <&nwgcc 2>,
                 <&dispcc0 3>;

        resets = <&dispcc0 4>;

        interconnects = <&mmss_noc 0 QCOM_ICC_TAG_ALWAYS
                         &mc_virt 1 QCOM_ICC_TAG_ALWAYS>,
                        <&hscnoc 2 QCOM_ICC_TAG_ACTIVE_ONLY
                         &config_noc 3 QCOM_ICC_TAG_ACTIVE_ONLY>;
        interconnect-names = "mdp0-mem", "cpu-cfg";

        interrupts = <GIC_SPI 930 IRQ_TYPE_LEVEL_HIGH>;
        interrupt-controller;
        #interrupt-cells = <1>;

        iommus = <&apps_smmu_1 0x3e0 0x20000>;

        #address-cells = <2>;
        #size-cells = <2>;
        ranges;

        display-controller@ae01000 {
            compatible = "qcom,nord-dpu";
            reg = <0x0 0x0ae01000 0x0 0x8f000>,
                  <0x0 0x0aeb0000 0x0 0x3000>;
            reg-names = "mdp", "vbif";
        };

        phy@aec2a00 {
            compatible = "qcom,nord-dp-phy";
            reg = <0x0 0x0aec2a00 0x0 0x200>,
                  <0x0 0x0aec2200 0x0 0xd0>,
                  <0x0 0x0aec2600 0x0 0xd0>,
                  <0x0 0x0aec2000 0x0 0x1c8>;
            #clock-cells = <1>;
            #phy-cells = <0>;
        };

        displayport-controller@af54000 {
            compatible = "qcom,nord-dp";
            reg = <0x0 0x0af54000 0x0 0x200>;
        };
    };
...
