%YAML 1.2
---
$id: http://devicetree.org/schemas/display/msm/qcom,nord-mdss.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm Nord Display MDSS

maintainers:
  - Claude Sonnet 5 <noreply@anthropic.com>

description:
  Nord MSM Mobile Display Subsystem(MDSS), which encapsulates sub-blocks like
  DPU display controller and DP interfaces.

  Nord has two structurally identical MDSS instances (MDSS_0, MDSS_1)
  sharing this one compatible/catalog; only MDSS_0 is enabled by any
  board for this bring-up.

  This binding is intentionally self-contained (no $ref to
  mdss-common.yaml) and closes with additionalProperties: false, unlike
  most other MDSS bindings in this directory.

properties:
  $nodename:
    pattern: "^display-subsystem@[0-9a-f]+$"

  compatible:
    const: qcom,nord-mdss

  reg:
    maxItems: 1

  reg-names:
    const: mdss

  power-domains:
    maxItems: 1

  clocks:
    items:
      - description: Display AHB clock (disp_cc_mdss_ahb_clk)
      - description: Display hf AXI clock, sourced from nwgcc (NW_GCC_DISP_0_HF_AXI_CLK)
      - description: Display core clock (disp_cc_mdss_mdp_clk)

  clock-names:
    items:
      - const: bus
      - const: nrt_bus
      - const: core

  interrupts:
    maxItems: 1

  interrupt-controller: true

  "#interrupt-cells":
    const: 1

  "#address-cells":
    const: 2

  "#size-cells":
    const: 2

  ranges: true

  iommus:
    maxItems: 1

  resets:
    items:
      - description: MDSS_CORE reset

  interconnects:
    items:
      - description: Interconnect path from mdp0 port to the data bus
      - description: Interconnect path from CPU to the reg bus

  interconnect-names:
    items:
      - const: mdp0-mem
      - const: cpu-cfg

patternProperties:
  "^display-controller@[0-9a-f]+$":
    type: object
    additionalProperties: true
    properties:
      compatible:
        const: qcom,nord-dpu

  "^displayport-controller@[0-9a-f]+$":
    type: object
    additionalProperties: true
    properties:
      compatible:
        const: qcom,nord-dp

  "^phy@[0-9a-f]+$":
    type: object
    additionalProperties: true
    properties:
      compatible:
        const: qcom,nord-dp-phy

required:
  - compatible
  - reg
  - reg-names
  - power-domains
  - clocks
  - clock-names
  - interrupts
  - interrupt-controller
  - iommus
  - ranges

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/qcom,rpmh.h>
    #include <dt-bindings/interconnect/qcom,icc.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/power/qcom,rpmhpd.h>

    display-subsystem@ae00000 {
        compatible = "qcom,nord-mdss";
        reg = <0x0ae00000 0x1000>;
        reg-names = "mdss";

        power-domains = <&dispcc0 0>;

        clocks = <&dispcc0 3>,
                 <&nwgcc 7>,
                 <&dispcc0 70>;
        clock-names = "bus", "nrt_bus", "core";

        resets = <&dispcc0 0>;

        interconnects = <&mmss_noc MASTER_MDP0 QCOM_ICC_TAG_ALWAYS
                         &mc_virt SLAVE_EBI1 QCOM_ICC_TAG_ALWAYS>,
                        <&hscnoc MASTER_APPSS_PROC QCOM_ICC_TAG_ACTIVE_ONLY
                         &config_noc SLAVE_DISPLAY_CFG QCOM_ICC_TAG_ACTIVE_ONLY>;
        interconnect-names = "mdp0-mem", "cpu-cfg";

        interrupts = <GIC_SPI 930 IRQ_TYPE_LEVEL_HIGH>;
        interrupt-controller;
        #interrupt-cells = <1>;

        iommus = <&apps_smmu_1 0x3e0 0x20000>;
        #address-cells = <2>;
        #size-cells = <2>;
        ranges;

        display-controller@ae01000 {
            compatible = "qcom,nord-dpu";
            reg = <0x0ae01000 0x8f000>,
                  <0x0aeb0000 0x3000>;
            reg-names = "mdp", "vbif";
        };

        displayport-controller@af54000 {
            compatible = "qcom,nord-dp";
            reg = <0x0af54000 0x200>;
        };

        phy@aec2a00 {
            compatible = "qcom,nord-dp-phy";
            reg = <0x0aec2a00 0x200>;
        };
    };
...
